import java.util.zip.ZipInputStream

// Phone-upload bootstrap: unpack the complete Stream Link project before Gradle loads modules.
def payload = file('streamlink_payload.zip')
def marker = file('.streamlink_payload_extracted')
if (payload.exists() && !marker.exists()) {
    payload.withInputStream { input ->
        new ZipInputStream(input).withCloseable { zis ->
            def entry
            while ((entry = zis.nextEntry) != null) {
                def out = file(entry.name).canonicalFile
                def root = projectDir.canonicalFile
                if (!out.path.startsWith(root.path + File.separator) && out != root) {
                    throw new GradleException("Unsafe payload path: ${entry.name}")
                }
                if (entry.isDirectory()) {
                    out.mkdirs()
                } else {
                    out.parentFile.mkdirs()
                    out.withOutputStream { os -> os << zis }
                }
            }
        }
    }
    marker.text = 'ok\n'
}

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'StreamLink'
include ':tv', ':sender'
