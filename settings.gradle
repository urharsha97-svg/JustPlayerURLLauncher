pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

def payload = new File(settingsDir, "streamlink_payload.zip")
def marker = new File(settingsDir, ".streamlink_payload_extracted")

if (payload.exists() && !marker.exists()) {
    payload.withInputStream { input ->
        def zis = new java.util.zip.ZipInputStream(input)

        try {
            def entry

            while ((entry = zis.nextEntry) != null) {
                def entryName = entry.name.replace('\\', '/')

                if (entryName.startsWith('tv/') ||
                    entryName.startsWith('sender/') ||
                    entryName.startsWith('relay/')) {

                    def output = new File(settingsDir, entryName).canonicalFile
                    def root = settingsDir.canonicalFile

                    if (!output.path.startsWith(root.path + File.separator)) {
                        throw new GradleException(
                            "Unsafe payload path: ${entryName}"
                        )
                    }

                    if (entry.isDirectory()) {
                        output.mkdirs()
                    } else {
                        output.parentFile.mkdirs()

                        output.withOutputStream { os ->
                            os << zis
                        }
                    }
                }
            }
        } finally {
            zis.close()
        }
    }

    marker.text = "ok\n"
}

rootProject.name = "StreamLink"

include(":tv")
include(":sender")
