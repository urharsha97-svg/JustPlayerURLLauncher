pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

// Extract payload if present.
def payload = new File(settingsDir, "streamlink_payload.zip")
def marker = new File(settingsDir, ".streamlink_payload_extracted")

if (payload.exists() && !marker.exists()) {
    payload.withInputStream { input ->
        new java.util.zip.ZipInputStream(input).withCloseable { zis ->
            def entry

            while ((entry = zis.nextEntry) != null) {
                def output = new File(settingsDir, entry.name).canonicalFile
                def root = settingsDir.canonicalFile

                if (!output.path.startsWith(root.path + File.separator) &&
                    output != root) {
                    throw new GradleException(
                        "Unsafe payload path: ${entry.name}"
                    )
                }

                if (entry.isDirectory()) {
                    output.mkdirs()
                } else {
                    output.parentFile.mkdirs()
                    output.withOutputStream { os ->
                        os << zis
                    }
                }
            }
        }
    }

    marker.text = "ok\n"
}

rootProject.name = "StreamLink"

include(":tv")
include(":sender")
