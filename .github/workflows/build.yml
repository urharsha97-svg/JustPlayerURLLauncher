name: Build Stream Link Apps
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build TV receiver
        run: gradle :tv:assembleDebug --no-daemon
      - name: Build mobile sender
        run: gradle :sender:assembleDebug --no-daemon
      - name: Rename APKs
        run: |
          cp tv/build/outputs/apk/debug/tv-debug.apk Stream-Link-TV.apk
          cp sender/build/outputs/apk/debug/sender-debug.apk Stream-Link-Sender.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stream-Link-TV
          path: Stream-Link-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stream-Link-Sender
          path: Stream-Link-Sender.apk
          
