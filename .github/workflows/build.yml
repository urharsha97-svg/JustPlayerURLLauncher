name: Build Stream Link Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build TV app
        run: gradle :tv:assembleDebug --no-daemon

      - name: Build Sender app
        run: gradle :sender:assembleDebug --no-daemon

      - name: Find APKs
        run: |
          echo "TV APK:"
          find tv/build/outputs/apk -type f -name "*.apk" -print

          echo "Sender APK:"
          find sender/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare release files
        run: |
          mkdir -p release

          TV_APK=$(find tv/build/outputs/apk -type f -name "*.apk" | head -n 1)
          SENDER_APK=$(find sender/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$TV_APK" ]; then
            echo "TV APK was not generated."
            exit 1
          fi

          if [ -z "$SENDER_APK" ]; then
            echo "Sender APK was not generated."
            exit 1
          fi

          cp "$TV_APK" release/Stream-Link-TV.apk
          cp "$SENDER_APK" release/Stream-Link-Sender.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Link-TV
          path: release/Stream-Link-TV.apk

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Link-Sender
          path: release/Stream-Link-Sender.apk
