name: Build Stream Link Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build TV app
        run: ./gradlew :tv:assembleDebug --no-daemon

      - name: Build Sender app
        run: ./gradlew :sender:assembleDebug --no-daemon

      - name: Find generated APKs
        run: |
          echo "TV APKs:"
          find tv/build/outputs/apk -type f -name "*.apk" -print

          echo "Sender APKs:"
          find sender/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK files
        run: |
          mkdir -p release

          cp "$(find tv/build/outputs/apk -type f -name '*.apk' | head -n 1)" \
             release/Stream-Link-TV.apk

          cp "$(find sender/build/outputs/apk -type f -name '*.apk' | head -n 1)" \
             release/Stream-Link-Sender.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Link-TV
          path: release/Stream-Link-TV.apk

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Link-Sender
          path: release/Stream-Link-Sender.apk
